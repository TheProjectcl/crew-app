# Vistas previas (WhatsApp / Instagram / iMessage) con título, descripción y logo de la productora
# según el link público (?emb=, ?cf=, ?cf_buy=, ?bday_inv=, ?bday_panel=).
[[edge_functions]]
  path = "/"
  function = "og"

[[edge_functions]]
  path = "/index.html"
  function = "og"

# Panel de Guestly (login) en guestly.cl/app — es el mismo index.html
[[redirects]]
  from = "/app"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/app/"
  to = "/index.html"
  status = 200

# Validador QR de puerta (sin cuenta: código del evento + PIN) en guestly.cl/validar
[[redirects]]
  from = "/validar"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/validar/"
  to = "/index.html"
  status = 200
